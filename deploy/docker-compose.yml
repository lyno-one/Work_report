name: lyno-report
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    env_file: api.env
    environment:
      PORT: "3510"
      CORS_ORIGIN: https://report.lyno.com.vn
      DATABASE_PATH: /data/lyno.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3510:3510"
    volumes:
      - report_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3510/api/auth/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  web:
    command: ["npm", "run", "start", "--", "--hostname", "0.0.0.0", "--port", "3500"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    environment:
      PORT: "3500"
    ports:
      - "127.0.0.1:3500:3500"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  report_data:
